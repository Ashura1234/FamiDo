<section class="auth-page">
  <div class="auth-visual" aria-hidden="true">
    <img src="../maquette/image/family.png" alt="" width="100%" height="100%">
  </div>
  <div class="auth-copy">
    <p class="eyebrow">Bienvenue dans la maison</p>
    <h1>Connexion</h1>
    <p>Retrouve les tâches de ta famille en un clin d'œil.</p>
    <form class="form-card" data-form="login">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" placeholder="ex: parent@example.com" required>
      <label for="login-password">Mot de passe</label>
      <input id="login-password" name="password" type="password" placeholder="••••••••" required>
      <button class="button button-primary" type="submit">Se connecter</button>
      <p class="form-message" data-message></p>
    </form>
    <p class="form-link">Pas encore de compte ? <a href="/inscription" data-link>Créer un compte</a></p>
  </div>
</section>
