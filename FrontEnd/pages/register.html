<section class="auth-page register-page">
  <div class="auth-visual" aria-hidden="true"><img src="../maquette/image/family.png" alt="" width="100%" height="100%"></div>
  <div class="auth-copy">
    <p class="eyebrow">Ton quotidien, en équipe</p>
    <h1>Créer un compte</h1>
    <p>Rejoins une famille ou prépare la tienne.</p>
    <form class="form-card" data-form="register">
      <label for="register-prenom">Prénom</label>
      <input id="register-prenom" name="prenom" type="text" placeholder="ex: Pierre" required>
      <label for="register-email">Email</label>
      <input id="register-email" name="email" type="email" placeholder="ex: email@example.com" required>
      <div class="form-grid">
        <div><label for="register-password">Mot de passe</label><input id="register-password" name="password" type="password" required></div>
        <div><label for="register-confirm">Confirmer</label><input id="register-confirm" name="confirm" type="password" required></div>
      </div>
      <fieldset><legend>Je suis</legend><label class="radio"><input type="radio" name="role" value="ROLE_CHEF" checked> Chef de famille</label><label class="radio"><input type="radio" name="role" value="ROLE_MEMBRE"> Membre de famille</label></fieldset>
      <button class="button button-primary" type="submit">Créer mon compte</button>
      <p class="form-message" data-message></p>
    </form>
    <p class="form-link">Déjà inscrit ? <a href="/connexion" data-link>Se connecter</a></p>
  </div>
</section>
