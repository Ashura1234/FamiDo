<section class="page profile-page">
  <div class="page-heading">
    <div>
      <p class="eyebrow">Espace personnel</p>
      <h1>Mon profil</h1>
    </div>
    <span class="avatar"><i class="bi bi-person-fill"></i></span>
  </div>
  <section class="profile-hero panel">
    <div class="avatar profile-avatar" data-profile-initials>--</div>
    <div>
      <h2 data-profile-name>Utilisateur</h2>
      <p data-profile-role>Compte FamiDo</p>
    </div>
  </section>
  <section class="panel profile-details">
    <div class="panel-heading"><h2>Informations du compte</h2></div>
    <dl>
      <div>
        <dt>Prénom</dt>
        <dd data-profile-prenom>-</dd>
      </div>
      <div>
        <dt>Email</dt>
        <dd data-profile-email>-</dd>
      </div>
      <div>
        <dt>Rôle</dt>
        <dd data-profile-role-detail>-</dd>
      </div>
    </dl>
  </section>
  <button class="button button-dark profile-logout" type="button" data-logout>
    <i class="bi bi-box-arrow-right"></i> Se déconnecter
  </button>
</section>
